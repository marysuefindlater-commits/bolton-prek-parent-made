<style>
  :root{
    --ink:#16202b;
    --paper:#e6eaec;
    --card:#ffffff;
    --rule:#cfd7db;
    --teal:#0d6b58;
    --gold:#c8901a;
    --muted:#657781;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}

  header{margin-bottom:14px}
  h1{
    font:600 27px/1.1 "Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
    margin:0 0 6px;letter-spacing:-.01em;
  }
  .tally{color:var(--muted);font-size:13.5px}
  .tally b{color:var(--teal);font-weight:600}

  #map{
    height:330px;border-radius:3px;margin:14px 0 4px;
    border:1px solid var(--rule);background:#dfe5e7;
  }
  .maphint{color:var(--muted);font-size:12px;margin:0 0 16px}

  .controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  input[type=search]{
    flex:1 1 200px;min-width:0;padding:9px 11px;font-size:15px;
    border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink);
  }
  .toggle{
    display:flex;align-items:center;gap:7px;padding:9px 12px;
    border:1px solid var(--rule);border-radius:3px;background:var(--card);
    font-size:14px;cursor:pointer;white-space:nowrap;
  }
  .toggle input{margin:0;accent-color:var(--teal)}

  h2{
    font:600 12.5px/1 -apple-system,sans-serif;
    color:var(--muted);margin:26px 0 9px;
    padding-bottom:6px;border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;
  }
  h2 span{font-weight:400}

  .row{
    background:var(--card);border:1px solid var(--rule);
    border-radius:3px;margin-bottom:7px;overflow:hidden;
  }
  .row.been{border-left:3px solid var(--teal)}
  .head{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;cursor:pointer}
  .head:hover{background:#f6f8f8}
  .box{
    flex:0 0 20px;height:20px;margin-top:1px;border:1.5px solid var(--rule);
    border-radius:3px;background:#fff;cursor:pointer;position:relative;
  }
  .box:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .been .box{background:var(--teal);border-color:var(--teal)}
  .been .box::after{
    content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg);
  }
  .txt{flex:1;min-width:0}
  .nm{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
  .been .nm{color:var(--muted)}
  .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .flag{color:var(--gold);font-size:12.5px;margin-top:3px}
  .chev{color:var(--rule);font-size:12px;margin-top:4px}

  .panel{display:none;padding:0 12px 12px 43px;border-top:1px solid #eef1f2}
  .row.open .panel{display:block}
  label.nl{display:block;font-size:12.5px;color:var(--muted);margin:11px 0 5px}
  textarea{
    width:100%;min-height:74px;padding:9px 10px;font:14px/1.45 inherit;
    border:1px solid var(--rule);border-radius:3px;resize:vertical;
    background:#fcfdfd;color:var(--ink);
  }
  textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;background:#fff}
  .links{margin-top:9px;display:flex;gap:14px;font-size:13.5px}
  .links a{color:var(--teal);text-decoration:none;border-bottom:1px solid #b9d5ce}
  .links a:hover{border-bottom-color:var(--teal)}

  footer{
    margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);
    color:var(--muted);font-size:13px;
  }
  footer p{margin:0 0 10px;max-width:62ch}
  .bkp{display:flex;gap:8px;flex-wrap:wrap}
  .bkp button{
    padding:8px 13px;font:14px inherit;cursor:pointer;color:var(--ink);
    background:var(--card);border:1px solid var(--rule);border-radius:3px;
  }
  .bkp button:hover{background:#f6f8f8}

  .saved{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(70px);
    background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;
    font-size:13px;transition:transform .22s ease;pointer-events:none;z-index:9999;
  }
  .saved.on{transform:translateX(-50%) translateY(0)}

  .pop{font:14px/1.45 -apple-system,sans-serif;min-width:190px}
  .pop .pn{font-weight:600;font-size:15px;margin-bottom:3px}
  .pop .pm{color:var(--muted);font-size:12.5px;margin-bottom:8px}
  .pop button{
    width:100%;padding:7px;font-size:13.5px;font-family:inherit;cursor:pointer;
    border:1px solid var(--rule);background:#fff;border-radius:3px;color:var(--ink);
  }
  .pop button.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .pop a{display:inline-block;margin-top:7px;color:var(--teal);font-size:13px}
  .leaflet-popup-content-wrapper{border-radius:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    encodeURIComponent(p.n + " Atlanta GA") + "&query_place_id=" + p.g;
}
function st(id){ return S[id] || (S[id] = {v:false, note:""}); }

function toast(msg){
  const el = document.getElementById("saved");
  el.textContent = msg || "Saved";
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("on"), 1200);
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) S = JSON.parse(raw);
  }catch(e){ S = {}; }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); toast(); }
    catch(e){ toast("Couldn't save — storage may be full or blocked"); }
  }, 450);
}

function tally(){
  const n = P.filter(p=>st(p.i).v).length;
  document.getElementById("tally").innerHTML =
    "<b>" + n + "</b> of " + P.length + " visited";
}

function paint(p){
  const row = document.getElementById("r-"+p.i);
  const on = st(p.i).v;
  if(row) row.classList.toggle("been", on);
  const m = markers[p.i];
  if(m) m.setStyle({fillColor: on ? "#0d6b58" : "#ffffff",
                    color: on ? "#0d6b58" : "#c8901a",
                    fillOpacity: on ? 1 : .9});
}

function setVisited(p, on){
  st(p.i).v = on;
  paint(p); tally(); save();
}

/* ---------- map ---------- */
const map = L.map("map", {scrollWheelZoom:false}).setView([33.83,-84.32], 10);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:18, attribution:"&copy; OpenStreetMap contributors"}).addTo(map);

P.forEach(p=>{
  const m = L.circleMarker([p.lat,p.lng],
    {radius:7, weight:2.5, color:"#c8901a", fillColor:"#fff", fillOpacity:.9}).addTo(map);
  markers[p.i] = m;

  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = '<div class="pn"></div><div class="pm"></div>' +
                 '<button type="button"></button>' +
                 '<a target="_blank" rel="noopener">Directions</a> &middot; ' +
                 '<a href="#" class="jump">Notes</a>';
  el.querySelector(".pn").textContent = p.n;
  el.querySelector(".pm").textContent = p.a + " \u2014 " + p.t;
  const btn = el.querySelector("button");
  const sync = ()=>{
    const on = st(p.i).v;
    btn.textContent = on ? "\u2713 Been here" : "Mark as visited";
    btn.classList.toggle("on", on);
  };
  btn.addEventListener("click", ()=>{ setVisited(p, !st(p.i).v); sync(); });
  el.querySelector("a[target]").href = gmaps(p);
  el.querySelector(".jump").addEventListener("click", ev=>{
    ev.preventDefault(); map.closePopup();
    const row = document.getElementById("r-"+p.i);
    row.classList.add("open");
    row.scrollIntoView({behavior:"smooth", block:"center"});
    row.querySelector("textarea").focus();
  });
  m.on("popupopen", sync);
  m.bindPopup(el);
});

/* ---------- list ---------- */
const AREAS = ["West Midtown","Midtown","Downtown","Intown east & south",
               "North & northwest","Buford Highway","Northeast suburbs","South of the city"];

function build(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  AREAS.forEach(area=>{
    const mine = P.filter(p=>p.a===area);
    if(!mine.length) return;
    const h = document.createElement("h2");
    h.dataset.area = area;
    h.innerHTML = "<span></span><span></span>";
    h.children[0].textContent = area;
    h.children[1].textContent = mine.length;
    list.appendChild(h);

    mine.forEach(p=>{
      const s = st(p.i);
      const row = document.createElement("div");
      row.className = "row" + (s.v ? " been" : "");
      row.id = "r-"+p.i;
      row.dataset.hay = (p.n+" "+p.a+" "+p.t+" "+(p.f||"")).toLowerCase();

      row.innerHTML =
        '<div class="head">' +
          '<div class="box" role="checkbox" tabindex="0"></div>' +
          '<div class="txt"><div class="nm"></div><div class="meta"></div>' +
          (p.f ? '<div class="flag"></div>' : '') + '</div>' +
          '<div class="chev">\u25be</div>' +
        '</div>' +
        '<div class="panel">' +
          '<label class="nl">Your notes</label>' +
          '<textarea placeholder="What you ordered, who you went with, whether to go back\u2026"></textarea>' +
          '<div class="links"><a target="_blank" rel="noopener">Directions</a>' +
          '<a href="#" class="focus">Show on map</a></div>' +
        '</div>';

      row.querySelector(".nm").textContent = p.n;
      row.querySelector(".meta").textContent = p.t;
      if(p.f) row.querySelector(".flag").textContent = p.f;
      row.querySelector("a[target]").href = gmaps(p);

      const box = row.querySelector(".box");
      box.setAttribute("aria-checked", s.v);
      box.setAttribute("aria-label", "Been to " + p.n);
      const flip = ev=>{
        ev.stopPropagation();
        setVisited(p, !st(p.i).v);
        box.setAttribute("aria-checked", st(p.i).v);
      };
      box.addEventListener("click", flip);
      box.addEventListener("keydown", ev=>{
        if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); flip(ev); }
      });

      row.querySelector(".head").addEventListener("click", ()=> row.classList.toggle("open"));

      const ta = row.querySelector("textarea");
      ta.value = s.note || "";
      ta.addEventListener("click", e=>e.stopPropagation());
      ta.addEventListener("input", ()=>{ st(p.i).note = ta.value; save(); });

      row.querySelector(".focus").addEventListener("click", ev=>{
        ev.preventDefault();
        map.setView([p.lat,p.lng], 15);
        markers[p.i].openPopup();
        document.getElementById("map").scrollIntoView({behavior:"smooth", block:"center"});
      });

      list.appendChild(row);
    });
  });
  tally();
}

function filter(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const hide = document.getElementById("hide").checked;
  AREAS.forEach(area=>{
    let shown = 0;
    P.filter(p=>p.a===area).forEach(p=>{
      const row = document.getElementById("r-"+p.i);
      const ok = (!q || row.dataset.hay.includes(q)) && !(hide && st(p.i).v);
      row.style.display = ok ? "" : "none";
      if(ok) shown++;
    });
    const h = document.querySelector('h2[data-area="'+area+'"]');
    if(h){ h.style.display = shown ? "" : "none"; h.children[1].textContent = shown; }
  });
}
document.getElementById("q").addEventListener("input", filter);
document.getElementById("hide").addEventListener("change", filter);

/* ---------- backup ---------- */
document.getElementById("dl").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "atlanta-saved-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("up").addEventListener("click", ()=> document.getElementById("file").click());
document.getElementById("file").addEventListener("change", ev=>{
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const incoming = JSON.parse(r.result);
      Object.keys(incoming).forEach(k=>{
        const cur = S[k] || {v:false, note:""};
        S[k] = {
          v: cur.v || !!incoming[k].v,
          note: [cur.note, incoming[k].note].filter(Boolean).join("\n").trim()
        };
      });
      localStorage.setItem(KEY, JSON.stringify(S));
      build(); P.forEach(paint); filter();
      toast("Backup loaded");
    }catch(e){ toast("That file didn't look like a backup"); }
    ev.target.value = "";
  };
  r.readAsText(f);
});

load();
build();
P.forEach(paint);
map.fitBounds(P.map(p=>[p.lat,p.lng]), {padding:[28,28]});
</script>
</body>
</html>
